<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Detayı | YBS_NOTLARI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0B0F19',
              cardbg: '#161B22',
              cardhover: '#1F242C',
              primary: '#00d1ff',
              secondary: '#6366f1'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-primary selection:text-white">
    
    <div class="container mx-auto px-4 py-8 flex-grow max-w-5xl">
      <header class="mb-12 relative flex flex-col items-center">
        <!-- Background glow -->
        <div class="absolute top-0 flex justify-center items-center -z-10 w-full opacity-50">
          <div class="w-64 h-32 bg-primary/20 rounded-full blur-3xl"></div>
        </div>

        <div class="w-full flex justify-between items-start mb-6">
          <button onclick="location.href = '/'" class="group flex items-center gap-2 px-4 py-2 bg-cardbg hover:bg-cardhover border border-gray-700 hover:border-primary rounded-lg text-gray-300 hover:text-white transition-all duration-300 shadow-sm hover:shadow-[0_0_15px_rgba(0,209,255,0.3)]">
            <i class="fas fa-arrow-left text-primary group-hover:-translate-x-1 transition-transform"></i> Geri Dön
          </button>
        </div>

        <h1 id="course-name" class="text-3xl md:text-5xl font-bold text-center text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary mb-4 drop-shadow-sm">
          Ders Yükleniyor...
        </h1>
        <p id="exam-dates" class="text-gray-400 text-sm font-medium bg-cardbg/50 px-4 py-1.5 rounded-full border border-gray-800"></p>
      </header>

      <main class="md:px-8">
        <div class="flex items-center justify-between mb-8 border-b border-gray-800 pb-4">
          <h2 class="text-2xl font-bold flex items-center gap-3 text-white">
            <i class="far fa-folder-open text-primary text-xl"></i> Ders İçerikleri
          </h2>
        </div>
        
        <ul id="pdf-list" class="space-y-6">
          <!-- Dynamically injected by course_detail.js -->
        </ul>
      </main>
    </div>

    <!-- Footer -->
    <footer class="mt-auto border-t border-gray-800 bg-background/80 backdrop-blur-md py-6">
      <div class="container mx-auto px-4 text-center">
        <p class="text-gray-400 font-medium text-sm">
          Geliştirici İletişim: 
          <a href="https://github.com/rumata01" target="_blank" class="inline-flex items-center ml-1 text-primary hover:text-white transition-colors duration-300">
            <i class="fab fa-github text-lg mr-1.5"></i> Rumata
          </a>
        </p>
      </div>
    </footer>

    <script src="/static/course_detail.js"></script>
  </body>
</html>
