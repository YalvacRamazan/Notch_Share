<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBS_NOTLARI | Yönetim Bilişim Sistemleri Ders Notları</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS for base styles / animations -->
    <link rel="stylesheet" href="/static/style.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#0B0F19',
              cardbg: '#161B22',
              cardhover: '#1F242C',
              primary: '#00d1ff',
              secondary: '#6366f1'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-primary selection:text-white">
    
    <div class="container mx-auto px-4 py-10 flex-grow max-w-6xl">
      <header class="text-center mb-16 relative">
        <div class="absolute inset-0 flex justify-center items-center -z-10">
          <div class="w-64 h-64 bg-primary/20 rounded-full blur-3xl"></div>
          <div class="w-64 h-64 bg-secondary/20 rounded-full blur-3xl -ml-20"></div>
        </div>
        
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary mb-4 tracking-tight">
          Yönetim Bilişim Sistemleri
        </h1>
        <h2 class="text-2xl md:text-3xl text-gray-300 font-medium mb-8">Ders Notları</h2>
        
        <div id="exam-info" class="inline-flex flex-wrap justify-center gap-6 bg-cardbg/80 backdrop-blur-md border border-gray-800 px-6 py-3 rounded-full text-sm font-medium shadow-lg">
          <p class="flex items-center text-gray-300"><i class="fas fa-calendar-alt text-primary mr-2"></i>Vize Haftası: <span id="vize-date" class="text-white ml-2 animate-pulse">Yükleniyor...</span></p>
          <div class="w-px h-5 bg-gray-700 hidden md:block"></div>
          <p class="flex items-center text-gray-300"><i class="fas fa-calendar-check text-secondary mr-2"></i>Final Haftası: <span id="final-date" class="text-white ml-2 animate-pulse">Yükleniyor...</span></p>
        </div>
      </header>

      <main>
        <div id="course-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
          <!-- Courses injected by app.js -->
        </div>
      </main>
    </div>

    <!-- Footer -->
    <footer class="mt-auto border-t border-gray-800 bg-background/80 backdrop-blur-md py-6">
      <div class="container mx-auto px-4 text-center">
        <p class="text-gray-400 font-medium text-sm">
          Geliştirici İletişim: 
          <a href="https://github.com/rumata01" target="_blank" class="inline-flex items-center ml-1 text-primary hover:text-white transition-colors duration-300">
            <i class="fab fa-github text-lg mr-1.5"></i> Rumata
          </a>
        </p>
      </div>
    </footer>

    <script src="/static/app.js"></script>
  </body>
</html>
