<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f1e8">
    <meta name="description" content="Yönetim Bilişim Sistemleri ders notları ve kaynakları.">
    <title>Ders Detayı | YBS Ders Arşivi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body class="site-body detail-page">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="YBS Ders Arşivi ana sayfa">
          <span class="brand-mark" aria-hidden="true">Y</span>
          <span class="brand-copy"><strong>YBS</strong><span>Ders Arşivi</span></span>
        </a>
        <nav class="primary-nav" aria-label="Ana gezinme">
          <a class="nav-link" href="/">Tüm dersler</a>
          <a class="nav-link nav-github" href="https://github.com/YalvacRamazan/Notch_Share" target="_blank" rel="noopener noreferrer"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a>
        </nav>
      </div>
    </header>

    <main class="page-shell detail-shell">
      <a class="back-link" href="/"><i class="fas fa-arrow-left" aria-hidden="true"></i> Ders arşivine dön</a>
      <section class="course-hero" aria-labelledby="course-name">
        <p class="eyebrow">Ders sayfası</p>
        <h1 id="course-name">Ders yükleniyor…</h1>
        <div id="exam-dates" class="course-exam-dates" aria-label="Sınav tarihleri"></div>
      </section>

      <section class="materials-section" aria-labelledby="materials-title">
        <div class="section-heading materials-heading">
          <div><p class="eyebrow">Ders kaynakları</p><h2 id="materials-title">İçerikler</h2></div>
        </div>
        <div class="material-tabs" role="tablist" aria-label="İçerik türü">
          <button class="material-tab is-active tab-btn" id="tab-notes" type="button" role="tab" aria-selected="true" aria-controls="col-notes" data-target="col-notes"><i class="fas fa-book-open" aria-hidden="true"></i> Notlar</button>
          <button class="material-tab tab-btn" id="tab-docs" type="button" role="tab" aria-selected="false" aria-controls="col-docs" data-target="col-docs"><i class="fas fa-file-pdf" aria-hidden="true"></i> Dokümanlar</button>
          <button class="material-tab tab-btn" id="tab-links" type="button" role="tab" aria-selected="false" aria-controls="col-links" data-target="col-links"><i class="fas fa-link" aria-hidden="true"></i> Bağlantılar</button>
        </div>

        <div class="materials-content">
          <section id="col-notes" class="material-panel" role="tabpanel" aria-labelledby="tab-notes">
            <div id="markdown-list" class="note-list"></div>
          </section>
          <section id="col-docs" class="material-panel is-hidden" role="tabpanel" aria-labelledby="tab-docs" hidden>
            <div id="pdf-list" class="note-list"></div>
          </section>
          <section id="col-links" class="material-panel is-hidden" role="tabpanel" aria-labelledby="tab-links" hidden>
            <div id="link-list" class="note-list"></div>
          </section>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>YBS Ders Arşivi</span>
        <a href="https://github.com/YalvacRamazan/Notch_Share" target="_blank" rel="noopener noreferrer"><i class="fab fa-github" aria-hidden="true"></i> github.com/YalvacRamazan/Notch_Share</a>
      </div>
    </footer>

    <script src="/static/course_detail.js" defer></script>
  </body>
</html>
