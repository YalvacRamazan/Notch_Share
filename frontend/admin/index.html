<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f1e8">
    <meta name="robots" content="noindex, nofollow">
    <title>Yönetim Girişi | YBS Ders Arşivi</title>
    <link rel="stylesheet" href="/admin/static/admin.css">
  </head>
  <body class="admin-body login-body">
    <main class="login-wrap">
      <section class="login-card" aria-labelledby="login-title">
        <span class="brand-mark" aria-hidden="true">Y</span>
        <p class="eyebrow">Yönetim Paneli</p>
        <h1 id="login-title">Admin girişi</h1>
        <p class="login-note">Bu alan yalnızca içerik yöneticileri içindir.</p>
        <form id="login-form" novalidate>
          <label class="field">
            <span>Kullanıcı adı</span>
            <input id="username" name="username" type="text" required autocomplete="username" autocapitalize="none">
          </label>
          <label class="field">
            <span>Parola</span>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </label>
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button class="button button-primary button-block" type="submit">Giriş yap</button>
        </form>
        <a class="back-link" href="/"><i class="fas fa-arrow-left" aria-hidden="true"></i> Siteye dön</a>
      </section>
    </main>
    <script src="/admin/static/login.js" defer></script>
  </body>
</html>
